<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header class="title">
        Blackjack
    </header>

    <div class="row mt-2">
        <div class="col text-center">
            <button class="btn btn-primary">Nuevo juego</button>
            <button class="btn btn-primary">Hit</button>
            <button class="btn btn-primary">Stay</button>
        </div>
    </div>

    <div class="row container">
        <div class="col">
            <h1>Jugador 1 - <strong>0</strong></h1>
            <div id="player-cards">
                <img class="card" src="assets/cartas/10C.png" alt="cards">
            </div>
        </div>
    </div>

    <div class="row container mt-3">
        <div class="col">
            <h1>Computer - <strong>0</strong></h1>
            <div id="computer-cards">
                <img class="card" src="assets/cartas/10C.png" alt="cards">
            </div>
        </div>
    </div>



    <script src="assets/js/underscore-min.js"></script>
    <script src="assets/js/juego.js"></script>
</body>
</html>
